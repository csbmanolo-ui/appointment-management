<div class="container p-4">
  <div class="header-simple">
    <h2>Listado de Pacientes</h2>

    <button mat-raised-button color="primary" (click)="abrirDialogoNuevo()">
      <mat-icon>add</mat-icon> Nuevo Paciente
    </button>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z0 tabla-limpia">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>No.</th>
      <td mat-cell *matCellDef="let element">{{ element.id }}</td>
    </ng-container>

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre Completo</th>
      <td mat-cell *matCellDef="let element">{{ element.nombre }} {{ element.apellidos }}</td>
    </ng-container>

    <ng-container matColumnDef="seguro">
      <th mat-header-cell *matHeaderCellDef>Seguro</th>
      <td mat-cell *matCellDef="let element">
        {{ element.seguro }}
      </td>
    </ng-container>

    <ng-container matColumnDef="telefono">
      <th mat-header-cell *matHeaderCellDef>Teléfono</th>
      <td mat-cell *matCellDef="let element">{{ element.telefono }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" (click)="editarPaciente(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminarPaciente(element.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
