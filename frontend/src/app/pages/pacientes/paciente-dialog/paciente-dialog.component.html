<h2 mat-dialog-title>Nuevo Paciente</h2>

<mat-dialog-content>
  <form [formGroup]="pacienteForm" class="formulario-columna">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" placeholder="Ej. Juan" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Apellidos</mat-label>
      <input matInput formControlName="apellidos" placeholder="Ej. Pérez" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Teléfono</mat-label>
      <input matInput formControlName="telefono" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Seguro Médico</mat-label>
      <mat-select formControlName="seguro">
        <mat-option value="Privado">Privado</mat-option>
        <mat-option value="Sanitas">Sanitas</mat-option>
        <mat-option value="Adeslas">Adeslas</mat-option>
        <mat-option value="Asisa">Asisa</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()" [disabled]="pacienteForm.invalid">
    Guardar
  </button>
</mat-dialog-actions>
