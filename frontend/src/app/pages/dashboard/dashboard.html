<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer mode="side" opened class="sidenav">
    <mat-toolbar>Menú</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Inicio</span>
      </a>

      <a mat-list-item>
        <mat-icon matListItemIcon>calendar_today</mat-icon>
        <span matListItemTitle>Calendario</span>
      </a>

      <a mat-list-item>
        <mat-icon matListItemIcon>event_note</mat-icon>
        <span matListItemTitle>Citas</span>
      </a>

      <mat-divider></mat-divider>
      <div mat-subheader>Gestión</div>

      <a mat-list-item>
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Pacientes</span>
      </a>

      <a mat-list-item>
        <mat-icon matListItemIcon>medical_services</mat-icon>
        <span matListItemTitle>Doctores</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Gestión de Citas Médicas</span>
      <span class="spacer"></span>

      <button mat-button (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        Salir
      </button>
    </mat-toolbar>

    <div class="content-padding">
      <h1>Bienvenido al Panel de Control</h1>
      <p>Selecciona una opción del menú para empezar.</p>

      <div style="display: flex; gap: 20px; margin-top: 20px">
        <mat-card style="padding: 20px; background-color: #e3f2fd">
          <h3>Citas Hoy</h3>
          <h1>0</h1>
        </mat-card>
        <mat-card style="padding: 20px; background-color: #e8f5e9">
          <h3>Pacientes</h3>
          <h1>0</h1>
        </mat-card>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
